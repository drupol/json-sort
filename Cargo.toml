[package]
name = "json-sort"
version = "1.1.5"
edition = "2024"
authors = ["Pol Dellaiera <pol.dellaiera@protonmail.com>"]
homepage = "https://github.com/drupol/json-sort"
repository = "https://github.com/drupol/json-sort"
readme = "README.md"
license = "EUPL-1.2"
keywords = ["json", "sort"]
categories = ["command-line-utilities"]
description = "A command-line tool that sorts JSON files with a consistent key order, making them easier to read and maintain."

[dependencies]
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.12"
walkdir = "2.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.117"

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "json-sort"
path = "src/main.rs"

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
